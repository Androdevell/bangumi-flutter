name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage --concurrency=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android DNS regression tests
        working-directory: android
        run: |
          flutter build apk --debug --target-platform android-arm64
          bash ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64 --console=plain

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --concurrency=2
      - name: Windows release image and cache regression
        shell: pwsh
        run: ./tool/windows-image-smoke.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-native-regression
          path: build/verification/windows-image-smoke.*.log
          if-no-files-found: warn
